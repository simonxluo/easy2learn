<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>easy2learn · 面经刷题</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="brand">
        <h1>easy2learn</h1>
        <span id="conn-dot" class="dot off" title="实时连接状态"></span>
      </header>

      <section class="panel">
        <h2>主题</h2>
        <ul id="topic-list" class="topic-list"></ul>
      </section>

      <section class="panel">
        <h2>题型</h2>
        <div id="type-chips" class="chips"></div>
      </section>

      <section class="panel">
        <h2>模式</h2>
        <div class="chips" id="mode-chips">
          <button class="chip" data-mode="order">顺序</button>
          <button class="chip" data-mode="random">随机</button>
          <button class="chip" data-mode="wrong">错题</button>
        </div>
      </section>

      <section class="panel">
        <h2>进度</h2>
        <div id="stats" class="stats"></div>
        <button id="reset-progress" class="ghost small">重置进度</button>
      </section>

      <section class="panel">
        <h2>知识点</h2>
        <ul id="notes-list" class="notes-list"></ul>
      </section>

      <footer class="side-foot">
        <a class="ghost small btn-block" href="/learn.html" style="display:block;text-align:center;margin-bottom:6px;">📖 知识学习模式</a>
        <button id="btn-import" class="ghost small">＋ 导入题目(JSON)</button>
        <p class="hint">agent 可通过本地 API 实时增删改题目与前端</p>
      </footer>
    </aside>

    <main id="main">
      <div id="topbar">
        <span id="crumb"></span>
        <span id="live-badge" class="live hidden">● LIVE</span>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <div id="note-modal" class="modal hidden">
    <div class="modal-box">
      <header>
        <strong id="note-title"></strong>
        <button id="note-close" class="ghost">✕</button>
      </header>
      <article id="note-body" class="md"></article>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
