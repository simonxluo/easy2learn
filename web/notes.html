<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>easy2learn · 笔记浏览</title>
  <link rel="stylesheet" href="style.css" />
  <script>window.E2L_BASE = "__E2L_BASE__".indexOf("__") === 0 ? "" : "__E2L_BASE__"</script>
  <script>
    /* 首屏应用外观偏好，防止主题闪烁（与 theme.js 共用 'e2l-theme' 键） */
    (function () {
      try {
        var t = localStorage.getItem('e2l-theme')
        var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
        var light = t === 'light'
        var c = document.documentElement.classList
        if (dark) c.add('dark')
        if (light) c.add('light')
      } catch (e) { /* 隐私模式忽略 */ }
    })()
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
</head>
<body class="notes">
  <div id="app">
    <aside id="sidebar">
      <header class="brand">
        <h1>笔记库</h1>
        <span id="conn-dot" class="dot off" title="实时连接状态"></span>
      </header>

      <section class="panel">
        <h2>目录 <span id="note-count" class="note-count"></span></h2>
        <input id="note-search" class="note-search" type="search" placeholder="搜索笔记…" autocomplete="off" />
        <div id="note-nav" class="note-nav"></div>
      </section>

      <section class="panel">
        <h2>外观</h2>
        <div class="seg mini" id="theme-toggle">
          <button class="seg-btn" data-theme-opt="auto">自动</button>
          <button class="seg-btn" data-theme-opt="light">浅色</button>
          <button class="seg-btn" data-theme-opt="dark">深色</button>
        </div>
      </section>

      <footer class="side-foot">
        <a class="ghost small btn-block" href="index.html" style="display:block;text-align:center;margin-bottom:6px;">📝 去刷题</a>
        <a class="ghost small btn-block" href="learn.html" style="display:block;text-align:center;">📖 知识学习模式</a>
        <p id="legacy-hint" class="hint hidden">当前为精简目录（服务进程较旧），重启 DSH 宿主后显示全部笔记</p>
        <p class="hint">↑↓ 或 J/K 切换笔记 · 笔记被编辑时实时刷新</p>
      </footer>
    </aside>

    <main id="main">
      <div id="topbar">
        <span id="crumb"></span>
        <span id="note-meta" class="note-meta"></span>
        <span id="live-badge" class="live hidden">● LIVE</span>
      </div>
      <div id="content">
        <article id="note-body" class="md note-doc hidden"></article>
        <div id="note-empty" class="empty"><span class="big">📚</span>从左侧选择一篇笔记开始阅读</div>
      </div>
    </main>
  </div>

  <script src="theme.js" defer></script>
  <script type="module" src="notes.js"></script>
</body>
</html>
