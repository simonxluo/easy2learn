<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>easy2learn · 知识学习</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
</head>
<body class="learn">
  <div id="app">
    <aside id="sidebar">
      <header class="brand">
        <h1>知识学习</h1>
        <span id="conn-dot" class="dot off" title="实时连接状态"></span>
      </header>

      <section class="panel">
        <h2>科目</h2>
        <ul id="topic-list" class="topic-list"></ul>
      </section>

      <section class="panel grow">
        <h2>大纲 <span id="outline-progress" class="count"></span></h2>
        <input id="outline-search" type="search" placeholder="🔍 搜索知识点…" autocomplete="off" />
        <nav id="outline" class="outline"></nav>
      </section>

      <footer class="side-foot">
        <a class="ghost small btn-block" href="/">✍️ 去刷题</a>
        <p class="hint">笔记被 agent 编辑时会自动刷新</p>
      </footer>
    </aside>

    <main id="main">
      <div id="topbar">
        <span id="crumb">加载中…</span>
        <span class="topbar-actions">
          <button id="btn-prev" class="ghost small">← 上一节</button>
          <button id="btn-mark" class="ghost small">✓ 标记已学</button>
          <button id="btn-next" class="ghost small">下一节 →</button>
          <span id="live-badge" class="live hidden">● LIVE</span>
        </span>
      </div>
      <div id="content"><p style="color:var(--muted)">加载中…</p></div>
    </main>
  </div>

  <script type="module" src="/learn.js"></script>
</body>
</html>
